<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aletheia Governance Terminal | v1.0.0</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020617;
            color: #94a3b8;
            overflow: hidden;
        }
        .mono { font-family: 'Fira Code', monospace; }
        .vibe-glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.4);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }
        .node-active {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .log-gradient {
            background: linear-gradient(to bottom, transparent, #020617);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [isBooting, setIsBooting] = useState(true);
            const [transparency, setTransparency] = useState(15);
            const [resistance, setResistance] = useState(80);
            const [advocacy, setAdvocacy] = useState(40);
            const [logs, setLogs] = useState([]);

            useEffect(() => {
                const timer = setTimeout(() => setIsBooting(false), 2000);
                addLog("核心協議載入中...");
                addLog("身分驗證：真理大學行政決策官");
                return () => clearTimeout(timer);
            }, []);

            const addLog = (msg) => {
                setLogs(prev => [`> ${msg}`, ...prev].slice(0, 8));
            };

            const runAction = (id) => {
                if (id === 'API') {
                    if (resistance > 50) {
                        addLog("錯誤：行政阻力過大，資料庫存取被拒。");
                        setResistance(r => Math.min(100, r + 5));
                    } else {
                        setTransparency(t => Math.min(100, t + 25));
                        addLog("成功：成績系統 API 已對接至 Aletheia App。");
                    }
                } else if (id === 'VOTE') {
                    setAdvocacy(a => Math.min(100, a + 20));
                    setResistance(r => Math.max(0, r - 15));
                    addLog("行動：發起學權投票，成功稀釋行政阻力。");
                } else if (id === 'DIGITAL') {
                    setTransparency(t => Math.min(100, t + 10));
                    addLog("優化：行政表單數位化完成，流程透明度提升。");
                }
            };

            if (isBooting) {
                return (
                    <div className="h-screen w-screen flex flex-col items-center justify-center bg-black">
                        <div className="w-1 h-1 bg-blue-500 rounded-full node-active mb-4"></div>
                        <div className="mono text-[10px] tracking-[0.5em] text-blue-500 animate-pulse">ALETHEIA CORE INITIALIZING</div>
                    </div>
                );
            }

            return (
                <div className="h-screen w-screen p-10 flex flex-col items-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
                    
                    {/* Header - Aletheia Brand */}
                    <header className="w-full max-w-6xl flex justify-between items-end mb-12 border-b border-slate-800 pb-6">
                        <div>
                            <h1 className="text-2xl font-bold tracking-[0.2em] text-white">真理行政終端 <span className="font-light text-slate-500">GOVERNANCE ENGINE</span></h1>
                            <p className="text-[10px] mono text-blue-400 mt-2">SECURE SESSION // AUTH_CHENG_YOU</p>
                        </div>
                        <div className="flex gap-12">
                            <MetricDisplay label="系統透明度" value={transparency} color="text-blue-400" />
                            <MetricDisplay label="行政阻力" value={resistance} color="text-rose-500" />
                            <MetricDisplay label="學權推動力" value={advocacy} color="text-emerald-400" />
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="w-full max-w-6xl grid grid-cols-12 gap-8">
                        
                        {/* Control Panel */}
                        <div className="col-span-7 space-y-6">
                            <div className="vibe-glass p-8 rounded-3xl">
                                <div className="flex items-center gap-3 mb-8">
                                    <div className="w-1.5 h-6 bg-blue-500"></div>
                                    <h2 className="text-xs font-bold tracking-widest text-slate-300 uppercase">戰略決策節點 / STRATEGIC NODES</h2>
                                </div>
                                
                                <div className="space-y-4">
                                    <NodeButton 
                                        title="推動成績數據 API 開放" 
                                        desc="將教務系統成績即時同步至學生端 App。"
                                        onClick={() => runAction('API')}
                                        status={resistance < 50 ? "可執行" : "阻力過高"}
                                    />
                                    <NodeButton 
                                        title="發起學權與透明化倡議" 
                                        desc="透過議會連署，向校方行政單位施壓。"
                                        onClick={() => runAction('VOTE')}
                                        status="準備就緒"
                                    />
                                    <NodeButton 
                                        title="行政申訴流程數位化" 
                                        desc="移除紙本限制，優化學期成績複查流程。"
                                        onClick={() => runAction('DIGITAL')}
                                        status="優化中"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Status & Logs */}
                        <div className="col-span-5 flex flex-col gap-6">
                            <div className="vibe-glass p-6 rounded-3xl flex-1 relative overflow-hidden">
                                <h3 className="text-[10px] font-bold text-slate-500 mb-6 tracking-widest">REAL-TIME LOGS</h3>
                                <div className="space-y-3 mono text-[11px]">
                                    {logs.map((log, i) => (
                                        <div key={i} className={i === 0 ? "text-blue-400" : "text-slate-600 opacity-60"}>{log}</div>
                                    ))}
                                </div>
                                <div className="absolute bottom-0 left-0 w-full h-20 log-gradient pointer-events-none"></div>
                            </div>

                            <div className="vibe-glass p-6 rounded-3xl border-l-2 border-emerald-500/50">
                                <h4 className="text-[10px] font-bold text-emerald-500 mb-2">SYSTEM ANALYSIS</h4>
                                <p className="text-xs text-slate-400 leading-relaxed font-light">
                                    當前學權推動力穩定。建議優先降低「行政阻力」以解鎖「成績數據 API」接口，達成真理大學 portal 數位化最終目標。
                                </p>
                            </div>
                        </div>
                    </main>

                    <footer className="mt-auto py-8 text-[10px] mono tracking-[0.4em] text-slate-600">
                        ALETHEIA UNIVERSITY // STUDENT RIGHTS ADVOCACY // BUILT WITH VIBE CODING
                    </footer>
                </div>
            );
        };

        const MetricDisplay = ({ label, value, color }) => (
            <div className="text-right">
                <div className="text-[9px] uppercase tracking-widest text-slate-500 mb-1">{label}</div>
                <div className={`text-xl font-bold mono ${color}`}>{value}%</div>
                <div className="w-20 h-1 bg-slate-800 mt-2 ml-auto overflow-hidden rounded-full">
                    <div className={`h-full bg-current ${color} transition-all duration-1000`} style={{width: `${value}%`}}></div>
                </div>
            </div>
        );

        const NodeButton = ({ title, desc, onClick, status }) => (
            <button 
                onClick={onClick}
                className="w-full group p-6 rounded-2xl border border-slate-800 hover:border-blue-500/30 hover:bg-blue-500/5 transition-all text-left flex justify-between items-center"
            >
                <div className="max-w-[70%]">
                    <div className="text-sm font-bold text-slate-200 group-hover:text-blue-400 transition-colors">{title}</div>
                    <div className="text-[10px] text-slate-500 mt-1 font-light">{desc}</div>
                </div>
                <div className="text-right px-4">
                    <div className={`text-[9px] mono uppercase p-1 px-2 rounded ${status === '阻力過高' ? 'bg-rose-500/10 text-rose-500' : 'bg-blue-500/10 text-blue-400'}`}>
                        {status}
                    </div>
                </div>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
